name: Download One File
run-name: "Download one file to ${{ inputs.GDRIVE_REMOTE || inputs.UPLOAD_REMOTE || 'gdrive3' }}:${{ inputs.GDRIVE_PATH || inputs.UPLOAD_PATH || 'Mirror' }}"

on:
  workflow_dispatch:
    inputs:
      DOWNLOAD_URL:
        description: 'Direct ZIP download link (one file only)'
        required: true
        type: string
      TEMP_FILE_NAME:
        description: 'Final file name, or download.zip for OTA metadata with original filename fallback'
        required: true
        type: string
        default: 'download.zip'
      UPLOAD_REMOTE:
        description: 'Upload rclone remote'
        required: false
        type: choice
        options:
          - gdrive3
          - gdrive1
          - 1drive
        default: 'gdrive3'
      UPLOAD_PATH:
        description: 'Folder path in selected remote'
        required: false
        type: string
        default: 'Mirror'
      GDRIVE_REMOTE:
        description: 'Legacy rclone remote name'
        required: false
        type: string
        default: ''
      GDRIVE_PATH:
        description: 'Legacy folder path'
        required: false
        type: string
        default: ''
      EXPECTED_BYTES:
        description: 'Expected file size in bytes (optional)'
        required: false
        type: string
        default: ''
      EXPECTED_SHA256:
        description: 'Expected SHA-256 checksum (optional)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  TZ: Asia/Ho_Chi_Minh

jobs:
  download-and-upload:
    name: Download and upload one file
    runs-on: ubuntu-latest
    timeout-minutes: 720

    outputs:
      final_name: ${{ steps.parse.outputs.final_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Download Inputs
        env:
          DOWNLOAD_URL: ${{ inputs.DOWNLOAD_URL }}
          EXPECTED_BYTES: ${{ inputs.EXPECTED_BYTES }}
          EXPECTED_SHA256: ${{ inputs.EXPECTED_SHA256 }}
        run: |
          set -euo pipefail
          echo "::add-mask::$DOWNLOAD_URL"
          if ! [[ "$DOWNLOAD_URL" =~ ^https?://[^[:space:]]+$ ]]; then
            echo "::error::Enter exactly one HTTP(S) download URL"
            exit 1
          fi
          if [ -n "$EXPECTED_BYTES" ] && ! [[ "$EXPECTED_BYTES" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::EXPECTED_BYTES must be a positive whole number"
            exit 1
          fi
          if [ -n "$EXPECTED_SHA256" ] && ! [[ "$EXPECTED_SHA256" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::EXPECTED_SHA256 must contain exactly 64 hexadecimal characters"
            exit 1
          fi

      - name: Install Tools
        run: |
          set -euo pipefail
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aria2 curl unzip jq ca-certificates
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure rclone
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64_3 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          if [ -z "${RCLONE_CONFIG_BASE64:-}" ]; then
            echo "::error::RCLONE_CONFIG_BASE64_3 secret is empty"
            exit 1
          fi
          echo "$RCLONE_CONFIG_BASE64" | base64 -d > ~/.config/rclone/rclone.conf
          if [ ! -s ~/.config/rclone/rclone.conf ]; then
            echo "::error::Could not create rclone.conf"
            exit 1
          fi
          rclone listremotes

      - name: Resolve Upload Destination
        id: destination
        env:
          INPUT_UPLOAD_REMOTE: ${{ inputs.UPLOAD_REMOTE }}
          INPUT_UPLOAD_PATH: ${{ inputs.UPLOAD_PATH }}
          LEGACY_GDRIVE_REMOTE: ${{ inputs.GDRIVE_REMOTE }}
          LEGACY_GDRIVE_PATH: ${{ inputs.GDRIVE_PATH }}
        run: |
          set -euo pipefail
          UPLOAD_REMOTE="${INPUT_UPLOAD_REMOTE:-}"
          UPLOAD_PATH="${INPUT_UPLOAD_PATH:-}"

          if [ -n "${LEGACY_GDRIVE_REMOTE:-}" ]; then
            UPLOAD_REMOTE="$LEGACY_GDRIVE_REMOTE"
          fi
          if [ -n "${LEGACY_GDRIVE_PATH:-}" ]; then
            UPLOAD_PATH="$LEGACY_GDRIVE_PATH"
          fi

          UPLOAD_REMOTE="${UPLOAD_REMOTE:-gdrive3}"
          UPLOAD_PATH="${UPLOAD_PATH:-Mirror}"
          UPLOAD_PATH="${UPLOAD_PATH#/}"
          UPLOAD_PATH="${UPLOAD_PATH%/}"

          case "$UPLOAD_REMOTE" in
            1drive|gdrive1|gdrive3)
              ;;
            *)
              echo "::error::Unknown upload remote: $UPLOAD_REMOTE"
              exit 1
              ;;
          esac

          if ! rclone listremotes | grep -qx "${UPLOAD_REMOTE}:"; then
            echo "::error::Rclone remote is not configured: ${UPLOAD_REMOTE}:"
            exit 1
          fi

          if [ -z "$UPLOAD_PATH" ]; then
            REMOTE_DIR="${UPLOAD_REMOTE}:"
          else
            REMOTE_DIR="${UPLOAD_REMOTE}:${UPLOAD_PATH}"
          fi

          echo "::add-mask::$REMOTE_DIR"
          rclone mkdir "$REMOTE_DIR"
          echo "remote=$UPLOAD_REMOTE" >> "$GITHUB_OUTPUT"
          echo "path=$UPLOAD_PATH" >> "$GITHUB_OUTPUT"
          echo "remote_dir=$REMOTE_DIR" >> "$GITHUB_OUTPUT"
          echo "Upload destination resolved"

      - name: Download, Parse Name, and Rename
        id: parse
        env:
          DOWNLOAD_URL: ${{ inputs.DOWNLOAD_URL }}
          TEMP_FILE_NAME: ${{ inputs.TEMP_FILE_NAME }}
        run: |
          set -euo pipefail
          echo "::add-mask::$DOWNLOAD_URL"

          REQUESTED_NAME="$(basename -- "${TEMP_FILE_NAME:-download.zip}")"
          if [ -z "$REQUESTED_NAME" ] || [ "$REQUESTED_NAME" = "." ] || [ "$REQUESTED_NAME" = "/" ]; then
            REQUESTED_NAME="download.zip"
          fi
          case "$REQUESTED_NAME" in
            *.zip) ;;
            *) REQUESTED_NAME="${REQUESTED_NAME}.zip" ;;
          esac

          # Let aria2 use the server's Content-Disposition filename or URL name.
          # A separate directory keeps it intact without colliding with repo files.
          DOWNLOAD_DIR="$(mktemp -d "$PWD/.ota-download.XXXXXX")"
          trap 'rmdir "$DOWNLOAD_DIR" 2>/dev/null || true' EXIT
          echo "Starting accelerated download"
          aria2c \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=1M \
            --max-tries=5 \
            --retry-wait=10 \
            --file-allocation=none \
            --summary-interval=10 \
            --auto-file-renaming=false \
            --content-disposition-default-utf8=true \
            --follow-metalink=false \
            --follow-torrent=false \
            --dir="$DOWNLOAD_DIR" \
            "$DOWNLOAD_URL"

          mapfile -d '' DOWNLOADED_FILES < <(find "$DOWNLOAD_DIR" -maxdepth 1 -type f ! -name '*.aria2' -print0)
          if [ "${#DOWNLOADED_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one downloaded file"
            exit 1
          fi
          DOWNLOAD_NAME="${DOWNLOADED_FILES[0]}"
          ORIGINAL_NAME="$(basename -- "$DOWNLOAD_NAME")"

          if [ ! -s "$DOWNLOAD_NAME" ]; then
            echo "::error::Downloaded file is missing or empty"
            exit 1
          fi

          if ! unzip -t "$DOWNLOAD_NAME" >/dev/null; then
            echo "::error::Downloaded file is not a valid zip archive"
            exit 1
          fi

          if [ "$REQUESTED_NAME" != "download.zip" ]; then
            FINAL_NAME="$REQUESTED_NAME"
            echo "Using requested final name"
          else
            FINAL_NAME=""
            if unzip -l "$DOWNLOAD_NAME" META-INF/com/android/metadata >/dev/null 2>&1; then
              METADATA_VERSION="$(unzip -p "$DOWNLOAD_NAME" META-INF/com/android/metadata 2>/dev/null | sed -n 's/^version_name_show=\(.*\)$/\1/p' | head -n1)"
              if [[ "$METADATA_VERSION" =~ [^[:space:]] ]]; then
                SAFE_VERSION="$(printf '%s' "$METADATA_VERSION" | tr -d '\r' | sed 's/[\/:*?"<>|()]/_/g; s/__*/_/g; s/_$//')"
                if [ -n "$SAFE_VERSION" ]; then
                  FINAL_NAME="${SAFE_VERSION}.zip"
                fi
              fi
            fi
          fi

          if [ -z "$FINAL_NAME" ]; then
            # Keep the original filename exactly, including its extension.
            FINAL_NAME="$ORIGINAL_NAME"
            echo "No OTA name found; keeping original filename"
          else
            FINAL_NAME="$(printf '%s' "$FINAL_NAME" | sed 's/[\/:*?"<>|()]/_/g; s/__*/_/g; s/_\\.zip$/.zip/')"
          fi
          mv -- "$DOWNLOAD_NAME" "./$FINAL_NAME"

          echo "final_name=$FINAL_NAME" >> "$GITHUB_OUTPUT"
          ls -lh -- "./$FINAL_NAME"

      - name: Verify File Size and SHA-256
        id: verify
        env:
          FINAL_NAME: ${{ steps.parse.outputs.final_name }}
          EXPECTED_BYTES: ${{ inputs.EXPECTED_BYTES }}
          EXPECTED_SHA256: ${{ inputs.EXPECTED_SHA256 }}
        run: |
          set -euo pipefail
          ACTUAL_BYTES="$(stat -c '%s' -- "./$FINAL_NAME")"
          if [ -n "$EXPECTED_BYTES" ] && [ "$ACTUAL_BYTES" != "$EXPECTED_BYTES" ]; then
            echo "::error::Size mismatch: expected $EXPECTED_BYTES, got $ACTUAL_BYTES"
            exit 1
          fi
          ACTUAL_SHA256="$(sha256sum < "./$FINAL_NAME")"
          ACTUAL_SHA256="${ACTUAL_SHA256:0:64}"
          if [ -n "$EXPECTED_SHA256" ] && [ "$ACTUAL_SHA256" != "${EXPECTED_SHA256,,}" ]; then
            echo "::error::SHA-256 checksum does not match"
            exit 1
          fi
          echo "actual_bytes=$ACTUAL_BYTES" >> "$GITHUB_OUTPUT"
          echo "sha256=$ACTUAL_SHA256" >> "$GITHUB_OUTPUT"
          echo "File size: $ACTUAL_BYTES bytes"
          echo "SHA-256: $ACTUAL_SHA256"

      - name: Send Initial Telegram Message
        id: send_initial
        uses: appleboy/telegram-action@master
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            Processing file:
            `${{ steps.parse.outputs.final_name }}`
          format: markdown

      - name: Upload and Verify File
        id: upload
        env:
          FINAL_NAME: ${{ steps.parse.outputs.final_name }}
          REMOTE_DIR: ${{ steps.destination.outputs.remote_dir }}
          ACTUAL_BYTES: ${{ steps.verify.outputs.actual_bytes }}
          ACTUAL_SHA256: ${{ steps.verify.outputs.sha256 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MESSAGE_ID: ${{ steps.send_initial.outputs.message_id }}
        run: |
          set -euo pipefail
          if [ -n "${MESSAGE_ID:-}" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageText" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "message_id=${MESSAGE_ID}" \
              -d "text=Uploading: \`${FINAL_NAME}\`" \
              -d "parse_mode=Markdown" >/dev/null || true
          fi

          rclone mkdir "$REMOTE_DIR"
          RCLONE_ARGS=(
            --log-level NOTICE
            --stats-one-line
            --stats 30s
            --progress
            --retries=5
            --low-level-retries=20
            --retries-sleep=20s
          )
          case "$REMOTE_DIR" in
            1drive:*)
              RCLONE_ARGS+=(
                --transfers=1
                --checkers=4
                --onedrive-chunk-size=10M
              )
              ;;
            *)
              RCLONE_ARGS+=(
                --transfers=1
                --checkers=4
                --multi-thread-streams=16
                --multi-thread-cutoff=32M
                --buffer-size=64M
                --drive-chunk-size=256M
              )
              ;;
          esac

          rclone copyto "./$FINAL_NAME" "${REMOTE_DIR}/${FINAL_NAME}" \
            "${RCLONE_ARGS[@]}"

          rclone lsjson "${REMOTE_DIR}/${FINAL_NAME}" --stat > uploaded-file.json
          jq -e --arg name "$FINAL_NAME" --argjson size "$ACTUAL_BYTES" \
            '.Name == $name and .Size == $size' uploaded-file.json

          {
            printf '### Uploaded: %s\n\n' "$FINAL_NAME"
            printf 'Destination: `%s/%s`\n\n' "$REMOTE_DIR" "$FINAL_NAME"
            printf 'Size: %s bytes\n\n' "$ACTUAL_BYTES"
            printf 'SHA-256: `%s`\n' "$ACTUAL_SHA256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send Success Notification
        if: success()
        uses: appleboy/telegram-action@master
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            Upload successful.

            File: `${{ steps.parse.outputs.final_name }}`
            Destination: `${{ steps.destination.outputs.remote_dir }}`
          format: markdown

      - name: Send Failure Notification
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            Upload failed.

            Workflow: ${{ github.workflow }}
            Run ID: ${{ github.run_id }}
            Check logs for details.
          format: markdown
