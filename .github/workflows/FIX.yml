name: OTA BUILD

on:
  workflow_dispatch:
    inputs:
      file_path:
        description: 'International ROM to dump'
        required: true
        type: string
      source_file_2_path:
        description: 'Donor ROM for selected partitions; leave empty when not replacing'
        required: false
        type: string
      file_types:
        description: 'ODM or REGION,OPLUSTANVBK'
        required: false
        type: string
      fix_ai:
        description: 'Apply AI'
        required: false
        type: boolean
        default: false
      BUILD_SUPER:
        description: 'Build super.img from organized dynamic partitions'
        required: false
        type: boolean
        default: false
      UPLOAD_TARGETS:
        description: 'Select which directories to upload.'
        required: true
        type: choice
        options:
          - organized
          - repacked
          - both
        default: 'repacked'
      UPLOAD_REMOTE:
        description: 'Select rclone remote for upload.'
        required: true
        type: choice
        options:
          - 1drive
          - 1drive1
          - gdrive1
          - gdrive2
        default: '1drive'

env:
  TZ: Asia/Ho_Chi_Minh

jobs:
  extract-and-replace:
    runs-on: ubuntu-latest
    timeout-minutes: 720

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"

      - name: Checkout FFF tool repository
        uses: actions/checkout@v4
        with:
          repository: 'proplayer1131/FFF_2026'
          token: ${{ secrets.ACTION_TOKEN || github.token }}

      - name: Normalize FFF CI config
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          config_path = Path("dump/file_change_config.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          device_configs = config.setdefault("device_configs", {})

          x9p = device_configs.setdefault("CPH2791", {})
          x9p["lk_fix_file"] = "x9p.img"
          x9p["variant_labels"] = {
              "NONE": "1Sim_OTA",
              "MCF_OTA": "2SIM_NoOTA",
              "MCF_OTA,MODEM": "2SIM_mo_NoOTA",
          }

          required_lk = {
              "CPH2651": "x8.img",
              "CPH2659": "x8p.img",
              "CPH2797": "x9.img",
              "CPH2791": "x9p.img",
          }
          for device_code, lk_file in required_lk.items():
              device_configs.setdefault(device_code, {})["lk_fix_file"] = lk_file

          config_path.write_text(
              json.dumps(config, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          python3 - <<'PY'
          from pathlib import Path

          script_path = Path("dump/scripts/ota_build_ci.sh")
          text = script_path.read_text(encoding="utf-8")

          start = text.index("rclone_copyto_fast() {")
          end = text.index("\n}\n\n", start) + 3
          replacement = '''rclone_copyto_fast() {
            local source="$1"
            local target="$2"

            local rclone_args=(
              --progress
              --stats 10s
              --retries=5
              --low-level-retries=20
              --retries-sleep=20s
            )

            case "$source" in
              1drive:*|1drive1:*)
                rclone_args+=(
                  --transfers=1
                  --checkers=4
                  --onedrive-chunk-size=10M
                )
                ;;
              *)
                rclone_args+=(
                  --transfers=4
                  --checkers=8
                  --multi-thread-streams=16
                  --buffer-size=64M
                  --drive-chunk-size=256M
                )
                ;;
            esac

            rclone copyto "$source" "$target" "${rclone_args[@]}"
          }'''
          text = text[:start] + replacement + text[end:]

          if "rot_boot_fw.img" not in text or "rot_boot_fmc.img" not in text:
              raise SystemExit("Could not verify rot_boot prune block")

          if "lk_target=\"organized/CRITICAL/lk.img\"" not in text:
              raise SystemExit("Could not verify LK target path")
          if "Removed old boot-chain image" not in text:
              raise SystemExit("Could not verify LK replacement cleanup block")

          script_path.write_text(text, encoding="utf-8")
          PY

          python3 dump/build_output_name.py --config dump/file_change_config.json --device-code CPH2791 --version 'CPH2791_16.0.9.400(EX01)' --file-types MCF_OTA --region VN
          python3 dump/build_output_name.py --config dump/file_change_config.json --device-code CPH2791 --version 'CPH2791_16.0.9.400(EX01)' --file-types MCF_OTA,MODEM --region VN

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify tool files
        run: bash dump/scripts/ota_build_ci.sh verify-tools

      - name: Install dependencies
        env:
          BUILD_SUPER: ${{ github.event.inputs.BUILD_SUPER }}
        run: bash dump/scripts/ota_build_ci.sh install-dependencies

      - name: Configure rclone
        env:
          RCLONE_CONF_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64_3 || secrets.RCLONE_CONFIG_BASE64 }}
        run: bash dump/scripts/ota_build_ci.sh configure-rclone

      - name: Get international base ROM
        id: get_rom
        env:
          FILE_PATH: ${{ github.event.inputs.file_path }}
          ONEDRIVE_MIRROR_REMOTE: ${{ vars.ONEDRIVE_MIRROR_REMOTE || '1drive1:Mirror' }}
          GDRIVE_STOCK_REMOTE: ${{ vars.GDRIVE_STOCK_REMOTE || 'gdrive1:VS_Stock' }}
        run: bash dump/scripts/ota_build_ci.sh get-base-rom

      - name: Get original donor ROM
        if: ${{ github.event.inputs.source_file_2_path != '' }}
        id: get_file_2
        env:
          FILE_PATH_2: ${{ github.event.inputs.source_file_2_path }}
          ONEDRIVE_MIRROR_REMOTE: ${{ vars.ONEDRIVE_MIRROR_REMOTE || '1drive1:Mirror' }}
          GDRIVE_STOCK_REMOTE: ${{ vars.GDRIVE_STOCK_REMOTE || 'gdrive1:VS_Stock' }}
        run: bash dump/scripts/ota_build_ci.sh get-donor-rom

      - name: Extract payload info
        id: payload_info
        run: bash dump/scripts/ota_build_ci.sh extract-payload-info

      - name: Resolve replacement plan
        id: replacement_plan
        env:
          DEVICE_CODE: ${{ steps.payload_info.outputs.device_code }}
          FILE_TYPES: ${{ github.event.inputs.file_types }}
          SOURCE_FILE_2_PATH: ${{ github.event.inputs.source_file_2_path }}
        run: bash dump/scripts/ota_build_ci.sh resolve-replacement-plan

      - name: Extract full international base ROM
        run: bash dump/scripts/ota_build_ci.sh extract-base-rom

      - name: Extract selected partitions from original donor ROM
        if: ${{ steps.replacement_plan.outputs.has_replacements == 'true' }}
        id: extract_file_2
        env:
          DEVICE_CODE: ${{ steps.payload_info.outputs.device_code }}
          FILE_TYPES: ${{ github.event.inputs.file_types }}
        run: bash dump/scripts/ota_build_ci.sh extract-donor-partitions

      - name: Replace base partitions with original ROM partitions
        id: copy_partitions
        env:
          DEVICE_CODE: ${{ steps.payload_info.outputs.device_code }}
          VERSION: ${{ steps.payload_info.outputs.version }}
          FILE_TYPES: ${{ github.event.inputs.file_types }}
        run: bash dump/scripts/ota_build_ci.sh copy-partitions

      - name: Resolve AI fix setting
        id: ai_fix_setting
        env:
          DEVICE_CODE: ${{ steps.payload_info.outputs.device_code }}
          VERSION: ${{ steps.payload_info.outputs.version }}
          FIX_AI_INPUT: ${{ github.event.inputs.fix_ai }}
        run: bash dump/scripts/ota_build_ci.sh resolve-ai-fix-setting

      - name: Apply AI my_region fix
        if: ${{ steps.ai_fix_setting.outputs.apply_ai_fix == 'true' }}
        id: fix_ai
        env:
          VERSION: ${{ steps.payload_info.outputs.version }}
          AI_FIX_REMOTE_DIR: ${{ vars.AI_FIX_REMOTE_DIR || 'gdrive1:Mirror/Oxygen/FileFix/AI' }}
        run: bash dump/scripts/ota_build_ci.sh apply-ai-fix

      - name: Apply LK fix
        id: fix_lk
        env:
          DEVICE_CODE: ${{ steps.payload_info.outputs.device_code }}
          LK_FIX_REMOTE_DIR: 1drive1:Mirror/Oxygen/FileFix/LK
        run: |
          set -euo pipefail
          lk_fix_file="$(python3 - "$DEVICE_CODE" <<'PY'
          import json
          import sys
          from pathlib import Path

          device_code = sys.argv[1]
          config = json.loads(Path("dump/file_change_config.json").read_text(encoding="utf-8"))
          print(config.get("device_configs", {}).get(device_code, {}).get("lk_fix_file", ""))
          PY
          )"

          if [ -n "$lk_fix_file" ]; then
            echo "Checking LK fix file: ${LK_FIX_REMOTE_DIR}/${lk_fix_file}"
            rclone listremotes
            if ! rclone lsf "${LK_FIX_REMOTE_DIR}" --files-only --include "$lk_fix_file" | grep -qx "$lk_fix_file"; then
              echo "LK file not found at default path; searching 1drive1"
              found_lk="$(rclone lsf --recursive --files-only "1drive1:" --include "$lk_fix_file" | grep -m1 "/${lk_fix_file}$" || true)"
              if [ -n "$found_lk" ]; then
                LK_FIX_REMOTE_DIR="1drive1:${found_lk%/*}"
                export LK_FIX_REMOTE_DIR
                echo "Using discovered LK folder"
              fi
            fi
          fi

          bash dump/scripts/ota_build_ci.sh apply-lk-fix

      - name: Show organized directory structure
        run: bash dump/scripts/ota_build_ci.sh show-organized

      - name: Build super image
        if: ${{ github.event.inputs.BUILD_SUPER == 'true' }}
        id: build_super
        env:
          DEVICE_CODE: ${{ steps.payload_info.outputs.device_code }}
          VERSION: ${{ steps.payload_info.outputs.version }}
        run: bash dump/scripts/ota_build_ci.sh build-super

      - name: Create final archive
        id: repack
        env:
          DEVICE_CODE: ${{ steps.payload_info.outputs.device_code }}
          VERSION: ${{ steps.payload_info.outputs.version }}
          REGION: ${{ steps.payload_info.outputs.region }}
          REPLACED_TYPES: ${{ steps.copy_partitions.outputs.file_types_replaced }}
          AI_FIX_REPLACED: ${{ steps.fix_ai.outputs.ai_fix_replaced }}
          SUPER_FILE: ${{ steps.build_super.outputs.super_file }}
        run: bash dump/scripts/ota_build_ci.sh repack

      - name: Set Upload Destination
        id: set_folder
        env:
          DEVICE_CODE: ${{ steps.payload_info.outputs.device_code }}
          VERSION: ${{ steps.payload_info.outputs.version }}
          REGION: ${{ steps.payload_info.outputs.region }}
          OUTPUT_FILE: ${{ steps.repack.outputs.output_file }}
        run: bash dump/scripts/ota_build_ci.sh set-upload-destination

      - name: Upload Dumps
        working-directory: ./dump
        env:
          UPLOAD_REMOTE: ${{ github.event.inputs.UPLOAD_REMOTE }}
          UPLOAD_TARGET: ${{ github.event.inputs.UPLOAD_TARGETS }}
          ARCHIVE_FILE: ${{ steps.repack.outputs.output_file }}
        run: |
          case "$UPLOAD_REMOTE" in
            1drive|1drive1|gdrive1|gdrive2)
              RCLONE_DEST="${UPLOAD_REMOTE}:Mirror/Oxygen"
              ;;
            *)
              echo "::error::Unknown upload remote: $UPLOAD_REMOTE"
              exit 1
              ;;
          esac

          DEVICE_REMOTE_PATH="${RCLONE_DEST}/${UPLOAD_DEVICE_FOLDER}"
          FULL_REMOTE_PATH="$DEVICE_REMOTE_PATH"
          UPLOAD_REMOTE_LABEL="$UPLOAD_DEVICE_FOLDER"

          if [ -n "${UPLOAD_REGION:-}" ]; then
            REGION_DIRS="$(rclone lsf --dirs-only "$DEVICE_REMOTE_PATH" 2>/dev/null || true)"
            HAS_REGION_DIR=false
            MATCHED_REGION_DIR=""

            while IFS= read -r REGION_DIR; do
              REGION_DIR="${REGION_DIR%/}"
              if [ -z "$REGION_DIR" ]; then
                continue
              fi

              REGION_DIR_UPPER="${REGION_DIR^^}"
              case "$REGION_DIR_UPPER" in
                EU|GLB|IN|INDIA)
                  HAS_REGION_DIR=true
                  ;;
              esac

              case "$UPLOAD_REGION" in
                IN)
                  if [ "$REGION_DIR_UPPER" = "IN" ]; then
                    MATCHED_REGION_DIR="$REGION_DIR"
                  elif [ -z "$MATCHED_REGION_DIR" ] && [ "$REGION_DIR_UPPER" = "INDIA" ]; then
                    MATCHED_REGION_DIR="$REGION_DIR"
                  fi
                  ;;
                EU|GLB)
                  if [ "$REGION_DIR_UPPER" = "$UPLOAD_REGION" ]; then
                    MATCHED_REGION_DIR="$REGION_DIR"
                  fi
                  ;;
              esac
            done <<< "$REGION_DIRS"

            if [ -n "$MATCHED_REGION_DIR" ]; then
              FULL_REMOTE_PATH="${DEVICE_REMOTE_PATH}/${MATCHED_REGION_DIR}"
              UPLOAD_REMOTE_LABEL="${UPLOAD_DEVICE_FOLDER}/${MATCHED_REGION_DIR}"
            elif [ "$HAS_REGION_DIR" = true ]; then
              FULL_REMOTE_PATH="${DEVICE_REMOTE_PATH}/${UPLOAD_REGION}"
              UPLOAD_REMOTE_LABEL="${UPLOAD_DEVICE_FOLDER}/${UPLOAD_REGION}"
            fi
          fi

          echo "::add-mask::${RCLONE_DEST}"
          echo "::add-mask::${DEVICE_REMOTE_PATH}"
          echo "::add-mask::${FULL_REMOTE_PATH}"
          echo "Preparing upload"
          echo "Device folder: ${UPLOAD_DEVICE_FOLDER}"
          echo "Region folder: ${UPLOAD_REGION:-N/A}"
          echo "Remote path: ${FULL_REMOTE_PATH}"
          echo "Upload target: $UPLOAD_TARGET"
          echo "Configured remotes:"
          rclone listremotes
          if ! rclone listremotes | grep -qx "${UPLOAD_REMOTE}:"; then
            echo "::error::Rclone remote is not configured: ${UPLOAD_REMOTE}:"
            exit 1
          fi
          rclone mkdir "$FULL_REMOTE_PATH"

          RCLONE_ARGS=(
            --log-level NOTICE
            --stats-one-line
            --stats 30s
            --progress
            --retries=5
            --low-level-retries=20
            --retries-sleep=20s
          )
          case "$UPLOAD_REMOTE" in
            1drive|1drive1)
              RCLONE_ARGS+=(
                --transfers=1
                --checkers=4
                --onedrive-chunk-size=10M
              )
              ;;
            gdrive1|gdrive2)
              RCLONE_ARGS+=(
                --transfers=4
                --checkers=8
                --multi-thread-streams=16
                --multi-thread-cutoff=32M
                --buffer-size=64M
                --drive-chunk-size=256M
              )
              ;;
          esac

          RCLONE_DIR_ARGS=("${RCLONE_ARGS[@]}")
          case "$UPLOAD_REMOTE" in
            1drive|1drive1)
              RCLONE_DIR_ARGS=(
                --transfers=2
                --checkers=4
                --onedrive-chunk-size=10M
                --log-level NOTICE
                --stats-one-line
                --stats 30s
                --progress
                --retries=5
                --low-level-retries=20
                --retries-sleep=20s
              )
              ;;
            gdrive1|gdrive2)
              RCLONE_DIR_ARGS=(
                --transfers=8
                --checkers=16
                --multi-thread-streams=8
                --multi-thread-cutoff=32M
                --buffer-size=64M
                --drive-chunk-size=256M
                --log-level NOTICE
                --stats-one-line
                --stats 30s
                --progress
                --retries=5
                --low-level-retries=20
                --retries-sleep=20s
              )
              ;;
          esac

          if [[ "$UPLOAD_TARGET" == "organized" ]]; then
            if [ -d "organized" ]; then
              rclone copy organized "${FULL_REMOTE_PATH}/organized" \
                "${RCLONE_DIR_ARGS[@]}"
            else
              echo "::error::organized directory not found"
              exit 1
            fi
          elif [[ "$UPLOAD_TARGET" == "repacked" ]]; then
            if [ -f "$ARCHIVE_FILE" ]; then
              rclone copyto "$ARCHIVE_FILE" "${FULL_REMOTE_PATH}/$(basename "$ARCHIVE_FILE")" \
                "${RCLONE_ARGS[@]}"
            else
              echo "::error::Archive file not found: $ARCHIVE_FILE"
              exit 1
            fi
          elif [[ "$UPLOAD_TARGET" == "both" ]]; then
            if [ -d "organized" ]; then
              rclone copy organized "${FULL_REMOTE_PATH}/organized" \
                "${RCLONE_DIR_ARGS[@]}"
            fi
            if [ -f "$ARCHIVE_FILE" ]; then
              rclone copyto "$ARCHIVE_FILE" "${FULL_REMOTE_PATH}/$(basename "$ARCHIVE_FILE")" \
                "${RCLONE_ARGS[@]}"
            fi
          else
            echo "::error::Unknown upload target: $UPLOAD_TARGET"
            exit 1
          fi

          echo "Upload completed. Verifying..."
          FILE_COUNT=$(rclone lsf --max-depth 2 "${FULL_REMOTE_PATH}" 2>/dev/null | wc -l || echo "0")

          if [ "$FILE_COUNT" -gt 0 ]; then
            echo "Upload confirmed. Files: $FILE_COUNT"
            UPLOAD_SIZE=$(rclone size --json "${FULL_REMOTE_PATH}" 2>/dev/null | jq -r '.bytes' | awk '{ sum=$1 ; hum[1024**3]="GB";hum[1024**2]="MB";hum[1024]="KB"; for (x=1024**3; x>=1024; x/=1024){ if (sum>=x) { printf "%.2f %s\n",sum/x,hum[x];break } }}' || echo "N/A")
          else
            echo "::error::Upload verification found 0 files"
            exit 1
          fi

          echo "BOT_OUTPUT::Ten thu muc=${UPLOAD_REMOTE_LABEL}"
          echo "BOT_OUTPUT::Kich thuoc=${UPLOAD_SIZE:-N/A}"
          echo "Upload done: ${FULL_REMOTE_PATH}"

      - name: Create summary
        env:
          PRODUCT: ${{ steps.payload_info.outputs.product }}
          DEVICE_CODE: ${{ steps.payload_info.outputs.device_code }}
          VERSION: ${{ steps.payload_info.outputs.version }}
          FILE_TYPES_REPLACED: ${{ steps.copy_partitions.outputs.file_types_replaced }}
          AI_FIX_REPLACED: ${{ steps.fix_ai.outputs.ai_fix_replaced }}
          OUTPUT_FILE: ${{ steps.repack.outputs.output_file }}
          SUPER_FILE: ${{ steps.build_super.outputs.super_file }}
        run: bash dump/scripts/ota_build_ci.sh create-summary
