name: DL OTA 2 FILE 

on:
  workflow_dispatch:
    inputs:
      DOWNLOAD_URL:
        description: 'Direct Download Link (to .zip file)'
        required: true
      TEMP_FILE_NAME:
        description: 'Temporary/Default name (e.g., download.zip)'
        required: true
        default: 'download.zip'
      GDRIVE_REMOTE:
        description: 'Your rclone remote name'
        required: true
        default: 'gdrive'
      GDRIVE_PATH:
        description: 'Folder path on Google Drive'
        required: true
        default: 'Mirror'
env:
  TZ: Asia/Ho_Chi_Minh

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      message_id: ${{ steps.send_initial.outputs.message_id }}
      final_name: ${{ steps.parse.outputs.final_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip aria2
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip rclone-current-linux-amd64.zip
          cd rclone-*-linux-amd64
          
          sudo cp rclone /usr/local/bin/
          sudo chown root:root /usr/local/bin/rclone
          sudo chmod 755 /usr/local/bin/rclone
          
          sudo ln -sf /usr/local/bin/rclone /usr/bin/rclone
          
          rclone version
      - name: Configure rclone
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_BASE64" | base64 -d > ~/.config/rclone/rclone.conf
      - name: Mask Remote Info in Logs
        run: |
          echo "::add-mask::${{ inputs.GDRIVE_REMOTE }}"
          echo "::add-mask::${{ inputs.GDRIVE_PATH }}"
      - name: Download, Parse Name, and Rename
        id: parse
        env:
          RAW_DOWNLOAD_URL: ${{ inputs.DOWNLOAD_URL }}
          RAW_TEMP_NAME: ${{ inputs.TEMP_FILE_NAME }}
        run: |
          # Xoá khoảng trắng, CR và LF ở đầu/cuối input
          DOWNLOAD_URL="$(
            printf '%s' "$RAW_DOWNLOAD_URL" |
            tr -d '\r\n' |
            sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          )"

          TEMP_NAME="$(
            printf '%s' "$RAW_TEMP_NAME" |
            sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          )"

          if [[ ! "$DOWNLOAD_URL" =~ ^https?:// ]]; then
              echo "::error::DOWNLOAD_URL không hợp lệ: phải bắt đầu bằng http:// hoặc https://"
              exit 1
          fi

          URL_BASENAME="$(basename "${DOWNLOAD_URL%%\?*}")"

          if [ -z "$URL_BASENAME" ] || [ "$URL_BASENAME" = "/" ]; then
              URL_BASENAME="download.zip"
          fi

          CURRENT_NAME="$URL_BASENAME"

          echo "Starting accelerated download..."
          echo "Output filename: $CURRENT_NAME"

          aria2c \
            -x 16 \
            -s 16 \
            --max-tries=5 \
            --retry-wait=5 \
            --file-allocation=none \
            -o "$CURRENT_NAME" \
            "$DOWNLOAD_URL"

          if [ ! -f "$CURRENT_NAME" ]; then
              echo "::error::Downloaded file not found: $CURRENT_NAME"
              exit 1
          fi

          echo "File successfully downloaded as: $CURRENT_NAME"
      - name: Send Initial Telegram Message
        id: send_initial
        uses: appleboy/telegram-action@master
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            Processing file:
            `${{ steps.parse.outputs.final_name }}`
          format: markdown

      - name: Upload and Update Message
        id: upload
        run: |
          echo "Updating Telegram message to 'Uploading'..."
          MSG_ID="${{ steps.send_initial.outputs.message_id }}"
          
          if [ -n "$MSG_ID" ]; then
              curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/editMessageText" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "message_id=$MSG_ID" \
              -d "text=Uploading: \`${{ steps.parse.outputs.final_name }}\`" \
              -d "parse_mode=Markdown"
          fi
          
          echo "Uploading to rclone remote..."
          /usr/local/bin/rclone copy "${{ steps.parse.outputs.final_name }}" "${{ inputs.GDRIVE_REMOTE }}:${{ inputs.GDRIVE_PATH }}" \
            --multi-thread-streams=32 \
            --multi-thread-cutoff=32M \
            --stats=10s
      - name: Send Success Notification
        if: success()
        uses: appleboy/telegram-action@master
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            ✅ Upload Successful!
            
            File: `${{ steps.parse.outputs.final_name }}`
            Destination: `${{ inputs.GDRIVE_REMOTE }}:${{ inputs.GDRIVE_PATH }}`
          format: markdown

      - name: Send Failure Notification (Build Job)
        if: failure() && steps.upload.outcome == 'failure'
        uses: appleboy/telegram-action@master
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            ❌ Upload FAILED in Build Job!
            
            Workflow: ${{ github.workflow }}
            Run ID: ${{ github.run_id }}
            Reason: Check logs for details.
          format: markdown
