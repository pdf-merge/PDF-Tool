name: Dispatch Google Drive Mirror Files to OneDrive

on:
  workflow_dispatch:
    inputs:
      source_root:
        description: "Google Drive source folder"
        required: true
        default: "gdrive2:Mirror"
      destination_root:
        description: "OneDrive destination folder"
        required: true
        default: "1drive:/Mirror"
      max_files:
        description: "Limit files to dispatch, 0 means all"
        required: true
        default: "0"
      delete_source:
        description: "Delete source file after verified upload"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-gdrive-mirror-to-onedrive
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Restore rclone config
        env:
          RCLONE_CONFIG_TEXT: ${{ secrets.RCLONE_CONFIG }}
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE642 }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.config/rclone"

          if [[ -n "${RCLONE_CONFIG_BASE64}" ]]; then
            printf '%s' "$RCLONE_CONFIG_BASE64" | base64 -d > "$HOME/.config/rclone/rclone.conf"
          elif [[ -n "${RCLONE_CONFIG_TEXT}" ]]; then
            printf '%s\n' "$RCLONE_CONFIG_TEXT" > "$HOME/.config/rclone/rclone.conf"
          else
            echo "Missing GitHub secret: set RCLONE_CONFIG_BASE642 or RCLONE_CONFIG." >&2
            exit 1
          fi

          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone listremotes

      - name: Dispatch one workflow per file
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ROOT: ${{ inputs.source_root }}
          DEST_ROOT: ${{ inputs.destination_root }}
          MAX_FILES: ${{ inputs.max_files }}
          DELETE_SOURCE: ${{ inputs.delete_source }}
        run: |
          set -Eeuo pipefail

          rclone lsf "$SOURCE_ROOT" --recursive --files-only > files.txt

          if [[ "$MAX_FILES" =~ ^[0-9]+$ ]] && [[ "$MAX_FILES" -gt 0 ]]; then
            head -n "$MAX_FILES" files.txt > limited.txt
            mv limited.txt files.txt
          fi

          total="$(wc -l < files.txt | tr -d ' ')"
          echo "Dispatching $total file workflow(s)"

          index=0
          while IFS= read -r file_path; do
            [[ -n "$file_path" ]] || continue
            index=$((index + 1))
            echo "Dispatch $index/$total: $file_path"

            jq -n \
              --arg ref "${GITHUB_REF_NAME:-main}" \
              --arg source_root "$SOURCE_ROOT" \
              --arg destination_root "$DEST_ROOT" \
              --arg file_path "$file_path" \
              --arg delete_source "$DELETE_SOURCE" \
              '{
                ref: $ref,
                inputs: {
                  source_root: $source_root,
                  destination_root: $destination_root,
                  file_path: $file_path,
                  delete_source: $delete_source
                }
              }' > payload.json

            curl -fsS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/copy-gdrive-mirror-one-file.yml/dispatches" \
              -d @payload.json

            sleep 1
          done < files.txt
