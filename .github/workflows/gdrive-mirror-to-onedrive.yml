name: Copy Google Drive Mirror to OneDrive

on:
  workflow_dispatch:
    inputs:
      source_root:
        description: "Google Drive source folder"
        required: true
        default: "gdrive:Mirror"
      destination_root:
        description: "OneDrive destination folder, for example 1drive:/Mirror"
        required: true
        default: "1drive:/Mirror"
      dry_run:
        description: "Preview only, do not copy files"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      delete_source:
        description: "Delete files from Google Drive after verified upload"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      batch_local_bytes:
        description: "Max local staging size per batch"
        required: true
        default: "50G"

concurrency:
  group: gdrive-mirror-to-onedrive
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"

      - name: Checkout LSConedrive repository
        uses: actions/checkout@v4
        with:
          repository: "proplayer1131/LSConedrive"
          token: ${{ secrets.ACTION_TOKEN }}

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Restore rclone config
        env:
          RCLONE_CONFIG_TEXT: ${{ secrets.RCLONE_CONFIG }}
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE642 }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.config/rclone"

          if [[ -n "${RCLONE_CONFIG_BASE64}" ]]; then
            printf '%s' "$RCLONE_CONFIG_BASE64" | base64 -d > "$HOME/.config/rclone/rclone.conf"
          elif [[ -n "${RCLONE_CONFIG_TEXT}" ]]; then
            printf '%s\n' "$RCLONE_CONFIG_TEXT" > "$HOME/.config/rclone/rclone.conf"
          else
            echo "Missing GitHub secret: set RCLONE_CONFIG_BASE642 or RCLONE_CONFIG." >&2
            exit 1
          fi

          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone listremotes

      - name: Write transfer environment
        env:
          SOURCE_ROOT_INPUT: ${{ inputs.source_root }}
          DEST_ROOT_INPUT: ${{ inputs.destination_root }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          DELETE_SOURCE_INPUT: ${{ inputs.delete_source }}
          BATCH_LOCAL_BYTES_INPUT: ${{ inputs.batch_local_bytes }}
        run: |
          set -Eeuo pipefail
          : > .env

          write_env() {
            printf '%s=%q\n' "$1" "$2" >> .env
          }

          write_env SOURCE_ROOT "$SOURCE_ROOT_INPUT"
          write_env DEST_ROOT "$DEST_ROOT_INPUT"
          write_env DRY_RUN "$DRY_RUN_INPUT"
          write_env DELETE_SOURCE "$DELETE_SOURCE_INPUT"
          write_env DELETE_EMPTY_SOURCE_DIRS "$DELETE_SOURCE_INPUT"
          write_env VERIFY_UPLOAD true
          write_env LIST_METHOD rclone
          write_env PARALLEL_FILES 16
          write_env TRANSFER_MODE batch
          write_env BATCH_LOCAL_BYTES "$BATCH_LOCAL_BYTES_INPUT"
          write_env DRY_RUN_LIMIT 20
          write_env RCLONE_FLAGS "--drive-use-trash=false --transfers=1 --checkers=8 --multi-thread-streams=4 --multi-thread-cutoff=32M --drive-chunk-size=256M --onedrive-chunk-size=100M --drive-pacer-min-sleep=10ms --drive-pacer-burst=200 --retries=10 --retries-sleep=20s --low-level-retries=20"

      - name: Run Google Drive to OneDrive copy
        env:
          WORK_DIR: ${{ github.workspace }}/gdrive_mirror_to_onedrive
        run: ./onedrive_to_gdrive.sh
